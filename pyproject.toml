[project]
name = "sts2-rl-agent"
version = "0.1.0"
description = "Slay the Spire 2 headless combat simulator and game bridge"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.0.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
notebook = [
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
include = ["sts2_env*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
